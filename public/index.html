<style>

/* Контейнери SimpleLightbox */
.sl-overlay,
.sl-wrapper,
.sl-outer,
.sl-inner {
    overflow-x: hidden !important;
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    padding: 0 !important;           /* прибираємо зайві відступи */
}

/* Стрілки (навігація) */
.sl-navigation .sl-prev,
.sl-navigation .sl-next {
    width: 50px !important;
    height: 50px !important;
    background: rgba(185, 182, 182, 0.6) !important;
    border-radius: 50% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 28px !important;
    color: #000000 !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    z-index: 9999 !important;
    padding: 0 !important;
    margin: 0 !important;
    box-sizing: border-box !important;
}

/* Позиціонування стрілок */
.sl-navigation .sl-prev {
    left: 12px !important;
}

.sl-navigation .sl-next {
    right: 12px !important;
}

/* Адаптив для мобільних екранів */
@media (max-width: 767px) {
    .sl-navigation .sl-prev,
    .sl-navigation .sl-next {
        width: 44px !important;
        height: 44px !important;
        font-size: 24px !important;
    }

    .sl-navigation .sl-prev  { left: 8px !important; }
    .sl-navigation .sl-next  { right: 8px !important; }
}
</style>


</head>

<body>

  <load src="partials/header.html" />
  <load src="partials/hero.html" />
  <load src="partials/about.html" />
  <load src="partials/price.html" />
  <load src="partials/gallery.html" />
  <load src="partials/footer.html" />


  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/body-scroll-lock/3.1.5/bodyScrollLock.min.js"
    integrity="sha512-HowizSDbQl7UPEAsPnvJHlQsnBmU2YMrv7KkTBulTLEGz9chfBoWYyZJL+MUO6p/yBuuMO/8jI7O29YRZ2uBlA=="
    crossorigin="anonymous"></script>

  <script src="https://cdn.jsdelivr.net/npm/simplelightbox@2/dist/simple-lightbox.min.js"></script>

  <script type="module" src="./main.js"></script>

<script>
  // Ініціалізуємо всі галереї (вони невидимі, тому нічого не заважає)
  const galleries = {};
  galleries.personal = new SimpleLightbox('#personal a', { /* опції */ });
  galleries.hochzeiten    = new SimpleLightbox('#hochzeiten a',    { /* опції */ });
  galleries.hochzeitspaket    = new SimpleLightbox('#hochzeitspaket a',    { /* опції */ });

  // Однакові опції для всіх
  const options = {
    captions: true,
    captionType: 'title',
    navText: ['←', '→'],
    swipeClose: true,
    showCounter: true,
    docClose: true,
    fadeSpeed: 300,
    resizeDuration: 200,
  wrapAround: true
      };

  // Краще так — один раз опції
  Object.keys(galleries).forEach(key => {
    galleries[key] = new SimpleLightbox(`#${key} a`, options);
  });

  // Обробка кліків по кнопках
  document.querySelectorAll('.open-gallery').forEach(btn => {
    btn.addEventListener('click', function() {
      const galId = this.getAttribute('data-gallery');
      const gallery = galleries[galId];
      
      if (gallery) {
        gallery.open();  // відкриває галерею з першого фото
      }
    });
  });
</script>

<script>
const btn = document.querySelector('.scroll-down-cont');
const footer = document.querySelector('#footer');

const observer = new IntersectionObserver(
  ([entry]) => {
    btn.classList.toggle('hidden', entry.isIntersecting);
  },
  { threshold: 0.1 }   // або 0 — коли футер тільки починає з'являтися
);

observer.observe(footer);

</script>
<script>
  document.querySelectorAll('.link-mobile').forEach(link => {
  link.addEventListener('click', function() {
    const modal = this.closest('[data-modal]');
    if (modal) {
      setTimeout(() => modalClose(modal), 80);
    }
  });
});
</script>
